# Overlay: TaskFlow embebido bajo SIGAO (/taskflow/), sin publicar :80.
# Usar junto con docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.sigao.yml up -d
#
# Local (SIGAO en :8080): export VITE_HMR_CLIENT_PORT=8080
# Prod  (SIGAO en :80):   VITE_HMR_CLIENT_PORT=80 (default)

services:
  frontend:
    environment:
      VITE_BASE_PATH: /taskflow/
      VITE_HMR_PROTOCOL: ${VITE_HMR_PROTOCOL:-ws}
      VITE_HMR_CLIENT_PORT: ${VITE_HMR_CLIENT_PORT:-80}

  backend:
    environment:
      # Evita colisión DNS con otros servicios llamados "db" en la red compartida
      # (p. ej. bloque-hub). El nombre estable del contenedor Compose es taskflowai-db-1.
      DATABASE_URL: postgresql://taskflow:taskflow_secret@taskflowai-db-1:5432/taskflow_db
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # Requiere exportar la key (sin default de desarrollo).
      SIGAO_API_KEY: ${TASKFLOW_SIGAO_API_KEY:?set TASKFLOW_SIGAO_API_KEY for the SIGAO overlay}

  nginx:
    ports: !override []
    volumes:
      - ./nginx/nginx.sigao.conf:/etc/nginx/nginx.conf:ro
